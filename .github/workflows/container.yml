name: Build and publish container image

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/nemored/pigeon-pod

jobs:
  prepare-tags:
    name: Prepare image tags
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          timestamp="$(date -u +'%Y%m%d%H%M%S')"
          tags=("${IMAGE_NAME}:sha-${GITHUB_SHA}")

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            pr_number="${{ github.event.pull_request.number }}"
            tags+=("${IMAGE_NAME}:pr-${pr_number}-${short_sha}")
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=("${IMAGE_NAME}:main-${short_sha}-${timestamp}")
          elif [[ "${GITHUB_REF}" == refs/heads/codex/* ]]; then
            branch_name="${GITHUB_REF#refs/heads/}"
            branch_tag="$(printf '%s' "${branch_name}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')"
            tags+=("${IMAGE_NAME}:${branch_tag}-${short_sha}")
          fi

          printf 'tags<<EOF\n' >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${tags[@]}" >> "${GITHUB_OUTPUT}"
          printf 'EOF\n' >> "${GITHUB_OUTPUT}"

  container:
    name: Build container image (${{ matrix.platform }})
    needs: prepare-tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare architecture-specific image tags
        id: arch-tags
        shell: bash
        env:
          TAGS: ${{ needs.prepare-tags.outputs.tags }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            printf '%s-%s\n' "${tag}" "${ARCH}"
          done <<< "${TAGS}" > arch-tags.txt

          printf 'tags<<EOF\n' >> "${GITHUB_OUTPUT}"
          cat arch-tags.txt >> "${GITHUB_OUTPUT}"
          printf 'EOF\n' >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.arch-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  manifest:
    name: Publish multi-platform manifest
    needs:
      - prepare-tags
      - container
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform manifest
        shell: bash
        env:
          TAGS: ${{ needs.prepare-tags.outputs.tags }}
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            docker buildx imagetools create \
              --tag "${tag}" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done <<< "${TAGS}"
